name: SilverHEN bridge integration check

on:
  push:
    branches: [ main, silverhen-bridge ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Afterglow module syntax
        run: |
          node --input-type=module --check < src/slopkit-afterglow/afterglow.js
          node --input-type=module --check < src/slopkit-afterglow/silverhen-bridge.mjs
      - name: Test shared bridge protocol
        run: node tests/test_silverhen_bridge.mjs
      - name: Test SilverHEN flavor selector
        run: node tests/test_silverhen_selector.mjs
